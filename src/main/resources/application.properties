spring.application.name=baozi-store

# ===== Banco de dados H2 =====
# H2 e um banco relacional que roda junto com a aplicacao (em memoria),
# entao nao precisa instalar nada. Os dados somem quando a aplicacao para.
spring.datasource.url=jdbc:h2:mem:baozidb
# usuario e senha padrao do H2
spring.datasource.username=sa
spring.datasource.password=

# ===== JPA / Hibernate =====
# "update" faz o Hibernate criar/atualizar as tabelas sozinho a partir das entidades
spring.jpa.hibernate.ddl-auto=update
# mostra no console os comandos SQL que estao sendo executados (ajuda a entender)
spring.jpa.show-sql=true

# ===== Console do H2 =====
# libera a tela do H2 no navegador: http://localhost:8080/h2-console
# (no login usar a mesma URL, usuario e senha que estao acima)
spring.h2.console.enabled=true

# ===== Exemplo para usar MySQL (nao esta sendo usado) =====
# para trocar para MySQL tem que colocar a dependencia mysql-connector-j no pom.xml
# e usar as linhas abaixo no lugar das linhas do H2
# spring.datasource.url=jdbc:mysql://localhost:3306/baozidb
# spring.datasource.username=root
# spring.datasource.password=sua_senha
